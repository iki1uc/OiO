        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        :root {
          --bg:#02060a; --surface:#080f16; --surface2:#050c12;
          --line:#1a2c3a; --line2:#0d1a24;
          --text:#c8f7ff; --dim:#4a6a80; --faint:#2a4050;
          --gold:#ffd700; --cyan:#00ccff; --lime:#39ff88;
          --violet:#a78bfa; --pink:#ff7a9e;
          --mono:'JetBrains Mono', ui-monospace, Consolas, monospace;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{background:var(--bg);color:var(--text);font:13px/1.5 var(--mono);min-height:100vh}
        body{background:radial-gradient(ellipse at 50% 0%,#0a1420 0%,#02060a 60%,#000 100%);-webkit-font-smoothing:antialiased}
        ::selection{background:var(--gold);color:#000}
        button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
        a{color:inherit;text-decoration:none}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

        .wrap{
          min-height:100vh;
          background:radial-gradient(ellipse at 50% 0%,#0a1420 0%,#02060a 60%,#000 100%);
          padding:var(--safe-area-inset-top, 0px) 0 0 0;
          box-sizing:border-box;
        }
        .app{max-width:1480px;margin:0 auto;padding:14px}

        .hdr{
          border:1px solid var(--line);border-radius:14px;
          padding:14px 18px;background:rgba(5,12,18,0.7);
          backdrop-filter:blur(8px);
          display:flex;align-items:center;justify-content:space-between;
          flex-wrap:wrap;gap:12px;margin-bottom:14px;
        }
        .hdr-left{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
        .hdr-left h1{font-size:18px;font-weight:800;letter-spacing:0.14em;color:var(--gold)}
        .hdr-left h1 small{font-size:10px;letter-spacing:0.2em;color:var(--cyan);font-weight:400;margin-left:8px}
        .hdr-chain{font-size:11px;letter-spacing:0.24em;color:var(--dim)}
        .hdr-chain b{color:var(--gold);font-weight:400}

        .mode{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,0.4)}
        .mode button{
          padding:6px 16px;border-radius:999px;font-size:10px;font-weight:700;
          letter-spacing:0.2em;color:var(--dim);transition:all 0.15s;
        }
        .mode button:hover{color:var(--text)}
        .mode button.on.bios{background:var(--gold);color:#000}
        .mode button.on.bio{background:var(--lime);color:#000}

        .main{display:grid;grid-template-columns:1fr 340px;gap:14px}
        @media(max-width:1024px){.main{grid-template-columns:1fr}}

        .board{
          position:relative;border:1px solid var(--line);border-radius:14px;
          background:rgba(5,12,18,0.6);min-height:660px;overflow:hidden;
        }
        .board::before{
          content:'';position:absolute;inset:0;
          background-image:
            linear-gradient(rgba(0,204,255,0.03) 1px,transparent 1px),
            linear-gradient(90deg,rgba(0,204,255,0.03) 1px,transparent 1px);
          background-size:32px 32px;pointer-events:none;
        }
        .board-hdr{
          position:absolute;top:12px;left:16px;right:16px;
          display:flex;justify-content:space-between;align-items:baseline;
          z-index:5;pointer-events:none;
        }
        .board-hdr .lbl{font-size:10px;letter-spacing:0.24em;color:var(--dim);text-transform:uppercase}
        .board-hdr .sub{font-size:10px;letter-spacing:0.14em;color:var(--faint)}

        .bios-stage{position:relative;width:100%;height:660px;display:block}
        .bios-stage.off{display:none}
        .bio-stage{position:relative;width:100%;min-height:660px;display:none;padding:60px 16px 20px}
        .bio-stage.on{display:block}
        .ring-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

        .bios-card{
          position:absolute;transform:translate(-50%,-50%);
          width:130px;padding:10px 12px;
          background:rgba(8,15,22,0.95);
          border:1px solid var(--line);border-radius:10px;
          cursor:pointer;transition:all 0.15s;z-index:10;
        }
        .bios-card:hover{
          border-color:var(--cyan);
          transform:translate(-50%,-50%) scale(1.06);
          box-shadow:0 0 20px rgba(0,204,255,0.2);
        }
        .bios-card.sel{border-color:var(--gold);box-shadow:0 0 24px rgba(255,215,0,0.3)}
        .bios-card .num{
          position:absolute;top:-8px;left:10px;
          background:var(--surface2);border:1px solid var(--line);
          padding:1px 7px;font-size:9px;font-weight:700;
          color:var(--dim);border-radius:4px;
        }
        .bios-card .nm{font-size:12px;font-weight:800;letter-spacing:0.1em;color:var(--text)}
        .bios-card .ds{font-size:9.5px;color:var(--dim);margin-top:2px;line-height:1.3}
        .bios-card.primary{border-color:rgba(57,255,136,0.6)}

        .bios-root{
          position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
          width:170px;height:170px;border-radius:50%;
          background:radial-gradient(circle,rgba(255,215,0,0.15),transparent 70%);
          border:2px solid var(--gold);
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          cursor:pointer;transition:all 0.2s;z-index:12;
          box-shadow:0 0 40px rgba(255,215,0,0.2);
        }
        .bios-root:hover{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 0 60px rgba(255,215,0,0.4)}
        .bios-root.sel{box-shadow:0 0 80px rgba(255,215,0,0.6)}
        .bios-root .t{font-size:22px;font-weight:800;letter-spacing:0.2em;color:var(--gold)}
        .bios-root .s{font-size:9px;letter-spacing:0.3em;color:var(--gold);opacity:0.7;margin-top:4px}
        .bios-root .dot{
          position:absolute;top:20px;width:8px;height:8px;border-radius:50%;
          background:var(--lime);box-shadow:0 0 10px var(--lime);
          animation:pulse 2s infinite;
        }
        @keyframes pulse{50%{opacity:0.4}}

        .erna-sat{
          position:absolute;top:22px;right:22px;
          padding:8px 12px;background:rgba(8,15,22,0.95);
          border:1px dashed var(--violet);border-radius:8px;
          font-size:10px;letter-spacing:0.14em;color:var(--violet);
          cursor:pointer;transition:all 0.15s;z-index:8;
        }
        .erna-sat:hover{background:rgba(167,139,250,0.1)}
        .erna-sat.sel{border-style:solid;border-color:var(--gold);color:var(--gold)}

        .bio-group{margin-bottom:18px}
        .bio-group-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;padding:0 4px}
        .bio-group-hd .nm{font-size:10px;letter-spacing:0.3em;font-weight:700}
        .bio-group-hd .ct{font-size:9px;color:var(--faint);letter-spacing:0.14em}
        .bio-group-hd .line{flex:1;height:1px;background:var(--line)}
        .bio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
        .bio-card{
          padding:10px 12px;background:rgba(8,15,22,0.95);
          border:1px solid var(--line);border-radius:8px;
          cursor:pointer;transition:all 0.15s;position:relative;
        }
        .bio-card:hover{border-color:var(--cyan);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,204,255,0.15)}
        .bio-card.sel{border-color:var(--gold);box-shadow:0 0 20px rgba(255,215,0,0.25)}
        .bio-card .fn{font-size:11px;font-weight:700;letter-spacing:0.04em;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .bio-card .ds{font-size:9.5px;color:var(--dim);margin-top:3px;line-height:1.35}
        .bio-card .ext{
          position:absolute;top:6px;right:8px;font-size:8px;
          letter-spacing:0.1em;padding:1px 5px;border-radius:3px;
          background:var(--surface2);border:1px solid var(--line);color:var(--dim);
        }
        .bio-card.g-brain{border-left:2px solid var(--pink)}
        .bio-card.g-os{border-left:2px solid var(--cyan)}
        .bio-card.g-nc{border-left:2px solid var(--violet)}
        .bio-card.g-geo{border-left:2px solid var(--lime)}
        .bio-card.g-dat{border-left:2px solid var(--gold)}

        .sidebar{display:flex;flex-direction:column;gap:12px}
        .card{border:1px solid var(--line);border-radius:12px;background:rgba(8,15,22,0.95);overflow:hidden}
        .card-hd{
          padding:10px 14px;background:var(--surface2);
          border-bottom:1px solid var(--line);
          font-size:10px;letter-spacing:0.2em;color:var(--dim);
          text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline;

        .detail .kv .item .k{font-size:8px;letter-spacing:0.16em;color:var(--faint)}
        .detail .kv .item .v{font-size:12px;font-weight:700;color:var(--text);margin-top:2px}
        .detail .open{
          display:block;width:100%;padding:10px;border-radius:8px;
          background:var(--gold);color:#000;font-weight:700;font-size:11px;
          letter-spacing:0.16em;text-align:center;transition:background 0.15s;
        }
        .detail .open:hover{background:#ffe533}
        .detail .open.bio{background:var(--lime)}
        .detail .open.bio:hover{background:#5fff9f}

        .log{font-size:10px;line-height:1.7;color:var(--dim);max-height:180px;overflow-y:auto;font-family:var(--mono)}
        .log .ln{display:flex;gap:6px}
        .log .ln .t{color:var(--faint);flex-shrink:0}
        .log .ln.ok{color:var(--lime)}
        .log .ln.warn{color:var(--pink)}

        .foot{
          margin-top:14px;padding:12px 16px;border-top:1px solid var(--line);
          font-size:10px;letter-spacing:0.14em;color:var(--faint);
          display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;
        }
        .foot b{color:var(--gold);font-weight:400}

        .net-mini-flow i{color:var(--faint);font-style:normal}
        .net-mini-flow .hl{color:var(--gold)}
        .net-mini-sub{font-size:9px;color:var(--faint);margin-top:6px;letter-spacing:0.08em}

        .flow-alert{margin-bottom:14px;padding:10px 12px;border:1px solid rgba(57,255,136,0.3);border-radius:8px;background:rgba(57,255,136,0.06)}
        .flow-alert-t{font-size:10px;font-weight:800;letter-spacing:0.14em;color:var(--lime);margin-bottom:6px}
        .flow-chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10px;color:var(--text)}
        .flow-chain em{color:var(--faint);font-style:normal}
        .flow-chain .b{color:var(--cyan);font-weight:700}
        .flow-chain .gold{color:var(--gold);font-weight:800}
        .flow-chain-sub{font-size:9px;color:var(--dim);margin-top:6px;letter-spacing:0.08em}

        .net-flow-panel{padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(57,255,136,0.04);display:flex;flex-direction:column;gap:6px}

        .net-flow-panel .chain{display:flex;gap:4px;align-items:center;font-weight:700;font-size:10px;color:var(--text)}
        .net-flow-panel .chain i{color:var(--faint);font-style:normal}
        .net-flow-panel .note{font-size:9px;color:var(--dim)}

        @media(max-width:640px){
          .bios-card{width:104px;padding:8px 10px}

          .bios-card .ds{display:none}
